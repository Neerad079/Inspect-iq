version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - smartinspect-network

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=smartinspect
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - smartinspect-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - smartinspect-network

networks:
  smartinspect-network:

volumes:
  mysql-data:
